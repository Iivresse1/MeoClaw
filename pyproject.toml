[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meoclaw"
version = "1.1.0"
description = "MeoClaw —— 基于 typer + langchain 的工作区受限编码智能体"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["agent", "cli", "typer", "langchain", "llm"]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "langchain>=1.4.0,<2.0.0",
    "langchain-core>=1.6.0,<2.0.0",
    "langchain-openai>=1.7.0,<2.0.0",
    "langgraph>=1.2.0,<2.0.0",
    "langgraph-checkpoint>=4.3.0,<5.0.0",
    "langgraph-checkpoint-sqlite>=3.1.0,<4.0.0",
    "tavily-python>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
meoclaw = "meoclaw.cli.app:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["meoclaw*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "bridge"]
# cacheprovider 关闭：仓库里残留过一个 ACL 损坏的 .pytest_cache（无法写入也不影响测试），
# 且本仓库测试量小，不需要 last-failed 缓存。
addopts = "-q -p no:cacheprovider"
